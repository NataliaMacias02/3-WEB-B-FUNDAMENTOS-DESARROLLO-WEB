<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position CSS</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <nav class="navbar">
        <a href="#home">Inicio</a>
        <a href="#services">Servicios</a>
        <a href="#about">Nosotros</a>
        <a href="#contact">Contacto</a>
    </nav>

    <div class="game-container">

        <img class="bg-game"
            src="https://c4.wallpaperflare.com/wallpaper/198/583/580/angry-birds-video-games-wallpaper-preview.jpg"
            alt="">

        <div class="x">❌</div>

        <h1 class="game-tittle">ANGRY BIRDS</h1>

        <div class="bird bird-1">
            <img src="https://www.freeiconspng.com/uploads/angry-birds-clipart-png-collection-19.png" alt="">
        </div>
        <div class="bird bird-2">
            <img src="https://th.bing.com/th/id/R.d58fd4677725c41f3da6ad862d922809?rik=DHdzEQh1iO1Z4w&riu=http%3a%2f%2fimagenpng.com%2fwp-content%2fuploads%2f2015%2f03%2fangry-bird-green-icon.png&ehk=IaW1I79HwOnHlnTU%2bWd4q5dq9rlRyzlrSOMRIguhDIs%3d&risl=&pid=ImgRaw&r=0"
                alt="">
        </div>

        <button class="btn-play">
            <img src="https://static.vecteezy.com/system/resources/previews/017/349/530/non_2x/buttons-and-frames-for-game-interface-free-png.png"
                alt="">
        </button>

        <div class="btn-config-game">
            <button class="btn-settings">⚙️</button>
            <button class="btn-world">🌝</button>
            <button class="btn-menu">📑</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="cookie-footer">

        <p>Este sitio utiliza cookies para mejorar la experiencia. <a href="#cookies-policy">Más información</a>.</p>

        <button class="cookie-accept">Aceptar</button>

    </footer>

</body>

</html>
